<div class="auth-card">

  <h2 class="auth-card__title">Reset Password</h2>

  <!-- SUCCESS MESSAGE -->
  @if (success) {
    <div class="alert alert-success">{{ message }}</div>
  }

  <!-- ERROR MESSAGE -->
  @if (error) {
    <div class="alert alert-error">{{ error }}</div>
  }

  <!-- IDENTIFIER (only needed for OTP flow) -->
  @if (method === 'otp') {
    <div class="form-group">
      <label for="identifier">Username / Email / Phone</label>
      <input
        id="identifier"
        type="text"
        [(ngModel)]="identifier"
        placeholder="Enter username, email or phone"
      />
    </div>
  }

  <!-- METHOD SWITCH (hide when token comes from URL) -->
  @if (!token) {
    <div class="segmented-switch">
      <button
        type="button"
        (click)="switchMethod('otp')"
        [class.active]="method === 'otp'"
      >
        OTP Reset
      </button>

      <button
        type="button"
        (click)="switchMethod('token')"
        [class.active]="method === 'token'"
      >
        Token Reset
      </button>
    </div>
  }

  <!-- OTP INPUT -->
  @if (method === 'otp') {
    <div class="form-group">
      <label for="otp">OTP</label>
      <input
        id="otp"
        type="text"
        [(ngModel)]="otp"
        placeholder="Enter OTP"
        maxlength="6"
      />
    </div>
  }

  <!-- TOKEN INPUT (only manual mode) -->
  @if (method === 'token' && !token) {
    <div class="form-group">
      <label for="token">Reset Token</label>
      <input
        id="token"
        type="text"
        [(ngModel)]="token"
        placeholder="Enter reset token"
      />
    </div>
  }

  <!-- SHOW TOKEN INFO (if coming from email link) -->
  @if (method === 'token' && token) {
    <div class="form-group">
      <label for="token-readonly">Reset Token</label>
      <input
        id="token-readonly"
        type="text"
        [value]="token"
        disabled
      />
    </div>
  }

  <!-- NEW PASSWORD -->
  <div class="form-group">
    <label for="newPassword">New Password</label>
    <input
      id="newPassword"
      type="password"
      [(ngModel)]="newPassword"
      placeholder="Enter new password"
    />
  </div>

  <!-- CONFIRM PASSWORD -->
  <div class="form-group">
    <label for="confirmPassword">Confirm Password</label>
    <input
      id="confirmPassword"
      type="password"
      [(ngModel)]="confirmPassword"
      placeholder="Confirm new password"
    />
  </div>

  <!-- SUBMIT BUTTON -->
  <button
    type="button"
    (click)="onSubmit()"
    [disabled]="loading"
  >
    @if (loading) {
      Resetting...
    } @else {
      Reset Password
    }
  </button>

  <div class="auth-card__footer">
    Remembered it?
    <a routerLink="/login">Login</a>
  </div>

</div>
