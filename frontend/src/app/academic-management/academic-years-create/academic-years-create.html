<!-- academic-years-create.html -->
<div class="page-wrap">

  <div class="page-header">
    <div class="header-left">
      <button class="btn-ghost" (click)="goToView()">← Back to View</button>
      <h1 class="page-title">Create Academic Years</h1>
    </div>
    <button class="btn-add" (click)="addRow()">+ Add Row</button>
  </div>

  <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
  <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Year Label <span class="req">*</span></th>
          <th>Start Date <span class="req">*</span></th>
          <th>End Date</th>
          <th>Current Year?</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let draft of drafts; let i = index">
          <td class="row-num">{{ i + 1 }}</td>
          <td>
            <input
              class="cell-input"
              type="text"
              placeholder="e.g. 2024-25"
              [(ngModel)]="draft.yearLabel"
            />
          </td>
          <td>
            <input
              class="cell-input"
              type="date"
              [(ngModel)]="draft.startDate"
            />
          </td>
          <td>
            <input
              class="cell-input"
              type="date"
              [(ngModel)]="draft.endDate"
            />
          </td>
          <td class="center-cell">
            <input
              type="checkbox"
              class="check-input"
              [(ngModel)]="draft.isCurrentYear"
            />
          </td>
          <td class="center-cell">
            <button
              class="btn-remove"
              (click)="removeRow(i)"
              [disabled]="drafts.length === 1"
            >✕</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer-actions">
    <button class="btn-save" (click)="saveAll()" [disabled]="saving || !isValid()">
      <span *ngIf="!saving">Save All</span>
      <span *ngIf="saving">Saving…</span>
    </button>
  </div>

</div>
