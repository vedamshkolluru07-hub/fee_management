<!-- uniform-create.html -->
<div class="page-wrap">

  <div class="page-header">
    <div class="header-left">
      <button class="btn-ghost" (click)="goToView()">← Back to View</button>
      <h1 class="page-title">Create Uniforms</h1>
    </div>
    <button class="btn-add" (click)="addRow()">+ Add Row</button>
  </div>

  <!-- Context -->
  <div class="context-bar" *ngIf="selectedYear">
    <span class="context-label">Academic Year:</span>
    <span class="context-value">{{ selectedYear.yearLabel }}</span>
  </div>
  <div class="alert alert-error" *ngIf="!selectedYear">
    No academic year selected. Please go back and select one.
  </div>

  <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
  <div class="alert alert-error"   *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Gender <span class="req">*</span></th>
          <th>Uniform Type <span class="req">*</span></th>
          <th>Size</th>
          <th>Amount</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let draft of drafts; let i = index">
          <td class="row-num">{{ i + 1 }}</td>

          <td>
            <select class="select-input" [(ngModel)]="draft.gender">
              <option value="" disabled>Select…</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </td>

          <td>
            <input class="cell-input" type="text" placeholder="e.g. Shirt" [(ngModel)]="draft.uniformType" />
          </td>

          <td>
            <input class="cell-input" type="text" placeholder="e.g. M, L, XL" [(ngModel)]="draft.size" />
          </td>

          <td>
            <input class="cell-input" type="number" placeholder="0.00" [(ngModel)]="draft.uniformAmount" />
          </td>

          <td class="center-cell">
            <button class="btn-remove" (click)="removeRow(i)" [disabled]="drafts.length === 1">✕</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer-actions">
    <button class="btn-save" (click)="saveAll()" [disabled]="saving || !isValid()">
      {{ saving ? 'Saving…' : 'Save All' }}
    </button>
  </div>

</div>
