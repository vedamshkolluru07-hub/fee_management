<div class="container">

  <!-- ======================================================
       TOP BAR (SINGLE ROW FIXED STRUCTURE)
  ====================================================== -->
  <div class="top-bar">

    <!-- LEFT: SEARCH SECTION -->
    <div class="search-section">

      <input
        type="text"
        class="search-input"
        placeholder="Search users by name, email..."
        [(ngModel)]="searchText"
      />

      <button class="btn btn-primary" (click)="searchUser()">
        Search
      </button>

      <button class="btn btn-secondary" (click)="loadUsers()">
        Reset
      </button>

    </div>

    <!-- RIGHT: ACTION SECTION -->
    <div class="action-section">

      <button class="btn btn-success" (click)="showCreateModal = true">
        + Create User
      </button>

    </div>

  </div>

  <!-- ======================================================
       TABLE SECTION
  ====================================================== -->
  <div class="table-wrapper">

    <table class="user-table">

      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Approved</th>
          <th>Manage</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let user of users">

          <td class="user-cell">
            <div class="user-name">
              {{ user.first_name }} {{ user.last_name }}
            </div>
          </td>

          <td>{{ user.email }}</td>

          <td>{{ user.phone }}</td>

          <td>
            <select
              class="role-select"
              [value]="user.role"
              #roleSelect
              (change)="changeRole(user, roleSelect.value)"
            >
              <option value="user">User</option>
              <option value="admin">Admin</option>
              <option value="moderator">Moderator</option>
            </select>
          </td>

          <td>
            <button class="toggle-btn" (click)="toggleIsApproved(user)">
              {{ user.is_approved ? 'Approved' : 'Pending' }}
            </button>
          </td>

          <td>
            <button class="toggle-btn" (click)="toggleCanManageUsers(user)">
              {{ user.can_manage_users ? 'Yes' : 'No' }}
            </button>
          </td>

          <td>
            <span class="status" [class.deleted]="user.deleted">
              {{ user.deleted ? 'Deleted' : 'Active' }}
            </span>
          </td>

          <td class="actions">

            <button class="btn btn-warning" (click)="openPasswordBox(user)">
              Reset
            </button>

            <button class="btn btn-danger" (click)="softDelete(user)">
              Soft
            </button>

            <button class="btn btn-danger-dark" (click)="hardDelete(user)">
              Delete
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- ======================================================
       PASSWORD MODAL
  ====================================================== -->
  <div class="modal-overlay" *ngIf="showPasswordBox">

    <div class="modal">

      <h3>Reset Password</h3>

      <form [formGroup]="passwordForm">

        <input
          type="password"
          formControlName="password"
          placeholder="Enter new password"
        />

      </form>

      <div class="modal-actions">

        <button
          class="btn btn-primary"
          (click)="updatePassword(selectedUser)"
        >
          Update
        </button>

        <button
          class="btn btn-secondary"
          (click)="showPasswordBox = null"
        >
          Cancel
        </button>

      </div>

    </div>

  </div>

  <!-- ======================================================
       CREATE USER MODAL
  ====================================================== -->
  <div class="modal-overlay" *ngIf="showCreateModal">

    <div class="modal large">

      <h2>Create New User</h2>

      <form [formGroup]="createForm" class="form-grid">

        <input formControlName="username" placeholder="Username" />
        <input formControlName="first_name" placeholder="First Name" />
        <input formControlName="last_name" placeholder="Last Name" />
        <input formControlName="email" placeholder="Email" />
        <input formControlName="phone" placeholder="Phone" />
        <input type="password" formControlName="password" placeholder="Password" />

        <select formControlName="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
          <option value="moderator">Moderator</option>
        </select>

      </form>

      <div class="modal-actions">

        <button class="btn btn-success" (click)="createUser()">
          Create User
        </button>

        <button class="btn btn-primary" (click)="createAdmin()">
          Create Admin
        </button>

        <button class="btn btn-secondary" (click)="showCreateModal = false">
          Close
        </button>

      </div>

    </div>

  </div>

</div>
